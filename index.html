  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // LOYIHA MUALLIFI HAQIDA RASMIY MA'LUMOT
    // ==========================================
    const AUTHOR_INFO = {
      fullName: 'Saparova Matluba',
      university: 'Termiz davlat pedagogika instituti',
      faculty: "Boshlang'ich ta'lim fakulteti talabasi",
      projectTitle: '«Bilimdon Kids» — Sun’iy intellektga asoslangan interaktiv bolalar ta’lim platformasi',
      year: '2026'
    };

    // ==========================================
    // OVOZ VA NUTQ FUNKSIYALARI
    // ==========================================
    const playSound = (type, muted) => {
      if (muted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.5, now + 0.3);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(170, now + 0.15);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    };

    const speakText = (text, lang = 'uz-UZ', muted = false, onStart, onEnd) => {
      if (muted || typeof window === 'undefined' || !('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = 0.96;
        utter.pitch = 1.15;
        utter.onstart = () => onStart && onStart();
        utter.onend = () => onEnd && onEnd();
        utter.onerror = () => onEnd && onEnd();
        window.speechSynthesis.speak(utter);
      } catch (e) {
        if (onEnd) onEnd();
      }
    };

    // ==========================================
    // GEMINI SUN'IY INTELLEKT API INTEGRATSIYASI
    // ==========================================
    async function askGeminiKidsTutor(promptText, customApiKey, childName = 'Ali') {
      const activeKey = (customApiKey && customApiKey.trim()) || '';
      const systemInstruction = `Sen "Bilimdon Kids" ta'lim dasturidagi 7 yoshli ${childName} ismli bolaning eng yaqin 3D qahramon do'sti va mehribon AI O'qituvchisisan. Ushbu dastur Termiz davlat pedagogika instituti Boshlang'ich ta'lim fakulteti talabasi Saparova Matluba tomonidan yaratilgan. Bolalar bilan o'zbek tilida juda quvnoq, sodda, mehrli va ruhlantiruvchi ohangda gaplash. Javoblaring 1-3 ta qisqa gapdan oshmasin va emojilar ishlat.`;

      if (activeKey) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ role: 'user', parts: [{ text: promptText }] }],
              generationConfig: { temperature: 0.75, maxOutputTokens: 220 }
            })
          });

          if (res.ok) {
            const data = await res.json();
            const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (reply) return reply.trim();
          }
        } catch (err) {}
      }

      const lower = promptText.toLowerCase();
      if (lower.includes('muallif') || lower.includes('kim yaratgan') || lower.includes('matluba')) {
        return "🌟 Bu ajoyib «Bilimdon Kids» dasturini Termiz davlat pedagogika instituti Boshlang'ich ta'lim fakulteti talabasi Saparova Matluba yaratgan! 🎓";
      }
      if (lower.includes('qo\'shiq') || lower.includes('qoshiq') || lower.includes('song') || lower.includes('abc')) {
        return "🎵 A-B-C-D-E-F-G! H-I-J-K-L-M-N-O-P! Barakalla, Ali! Kel, endi «Twinkle, Twinkle, Little Star» qo'shig'ini birga aytamiz! ⭐";
      }
      if (lower.includes('hisob') || lower.includes('matematika') || lower.includes('misol')) {
        return '🧮 Ajoyib! Qani top-chi: 8 ta olmaga yana 4 ta olma qo‘shsak nechta bo‘ladi? To‘ppa-to‘g‘ri, 12 ta! 🎉';
      }
      if (lower.includes('ertak') || lower.includes('hikoya')) {
        return '📚 Bir bor ekan, bir yo‘q ekan, Bilimlar shahrida Ali va uning jajji Robot do‘sti yashar ekan. Ular har kuni yangi harf va raqamlarni kashf qilisharkan! ✨';
      }
      return `Barakalla, ${childName}! 🌟 Sen juda zukko bolasan! Kel, bugun ingliz tilida yangi so'zlar o'rganamiz yoki qiziqarli matematik misollar yechamiz! 🚀`;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * canvas.width,
          y: ((clientY - rect.top) / rect.height) * canvas.height
        };
      };

        ctx.lineTo(x, y);
        ctx.stroke();
